name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore HappyPaws.sln

    - name: Build
      run: dotnet build HappyPaws.sln --no-restore -c Release

    - name: Test with code coverage
      run: dotnet test HappyPaws.sln --no-build -c Release --settings coverlet.runsettings --collect:"XPlat Code Coverage" --logger trx --results-directory "TestResults"

    - name: Generate code coverage report and badges
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.4
      with:
        reports: 'TestResults/**/coverage.cobertura.xml'
        targetdir: 'TestResults/CoverageReport'
        reporttypes: 'Html;MarkdownSummaryGithub;Badges;Cobertura'
        title: 'HappyPaws API Test Coverage'

    - name: Publish coverage summary to GitHub Step Summary
      run: cat TestResults/CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Commit updated coverage badge
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        mkdir -p .github/badges
        cp TestResults/CoverageReport/badge_linecoverage.svg .github/badges/badge_linecoverage.svg
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/badge_linecoverage.svg
        git diff --quiet && git diff --staged --quiet || (git commit -m "ci(coverage): update coverage badge [skip ci]" && git push)

    - name: Deploy coverage dashboard to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./TestResults/CoverageReport
        publish_branch: gh-pages

    # Match the new AWS Lightsail container deployment strategy by validating the Dockerfile
    # This ensures any build errors are caught in CI before deployment.
    - name: Verify Docker build
      run: docker build -t happypaws-api:test -f src/HappyPaws.Api/Dockerfile .
