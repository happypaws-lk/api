name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore HappyPaws.sln

    - name: Build
      run: dotnet build HappyPaws.sln --no-restore -c Release

    - name: Test
      run: dotnet test HappyPaws.sln --no-build -c Release --logger trx --results-directory "TestResults"

    # Match the new AWS Lightsail container deployment strategy by validating the Dockerfile
    # This ensures any build errors are caught in CI before deployment.
    - name: Verify Docker build
      run: docker build -t happypaws-api:test -f src/HappyPaws.Api/Dockerfile .
