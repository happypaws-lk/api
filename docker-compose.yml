version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: happypaws-db
    environment:
      POSTGRES_USER: happypaws
      POSTGRES_PASSWORD: happypaws_dev
      POSTGRES_DB: happypaws
    ports:
      - "5432:5432"
    volumes:
      - happypaws-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: happypaws-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - happypaws-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/happypaws-public &&
        mc mb --ignore-existing local/happypaws-private &&
        mc anonymous set download local/happypaws-public
      "

volumes:
  happypaws-pgdata:
  happypaws-minio-data:
